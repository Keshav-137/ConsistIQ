name: consistiq
description: ConsistIQ - routines, medicine alarms, study mode and streaks that never break.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: '>=0.18.0 <1.0.0'
  uuid: ^4.5.1
  http: ^1.2.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^5.1.1
  permission_handler: ^13.0.2
  local_auth: ^3.0.2
  device_calendar: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
